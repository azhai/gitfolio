<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>GitFolio · 项目</title>
    <link rel="stylesheet" href="/assets/css/app.css" />
  </head>
  <body class="app-body" data-page="project">
    <div id="app-shell"></div>

    <div x-data="project">
    <main class="app-main">
      <div class="loading-box" x-show="loading">
        <span class="spinner"></span><span x-text="t('common.loading')"></span>
      </div>

      <div x-show="!loading" x-cloak>
        <!-- header -->
        <div class="repo-head">
          <div class="row between gap-16 wrap">
            <div class="min-w-0">
              <h1 class="repo-title">
                <span class="muted"><a :href="ownerUrl" x-text="owner"></a> / </span>
                <a :href="base" x-text="repo && repo.name"></a>
                <span class="badge repo-title__badge" :class="projectTypeClass(repo && repo.project_type)"
                  x-text="projectTypeLabel(repo && repo.project_type)"></span>
              </h1>
            </div>
            <div class="row gap-8 wrap">
              <!-- 当前分支 + 切换：能管理且有工作区才出现 -->
              <div class="branch-switch" x-show="canManage && repo && repo.has_work_tree && branches.length"
                x-cloak>
                <span x-icon="{ name: 'git-branch', size: 14, color: '#9ca3af' }"></span>
                <select class="select select--sm" x-model="branchDraft" @change="switchBranch">
                  <template x-for="b in branches" :key="'hb-' + b">
                    <option :value="b" x-text="b"></option>
                  </template>
                </select>
              </div>
              <div class="btn-group">
                <button class="btn btn--sm" @click="toggleStar">
                  <span x-icon="{ name: 'star', size: 14 }"></span>
                  <span x-text="(repo && repo.stars_count) || 0"></span>
                </button>
                <button class="btn btn--sm" @click="copyClone">
                  <span x-icon="{ name: 'link-2', size: 14 }"></span>
                  <span x-text="t('project.copyClone')"></span>
                </button>
              </div>
            </div>
          </div>
          <p class="text-sm muted mt-12" x-show="repo && repo.description"
            x-text="repo && repo.description"></p>
        </div>

        <div class="tabs mb-20">
          <a class="tab" :class="tab === 'tree' ? 'is-active' : ''" :href="base">
            <span x-icon="{ name: 'file-code', size: 15 }"></span>
            <span x-text="t('project.files')"></span>
          </a>
          <a class="tab" :class="tab === 'commits' ? 'is-active' : ''" :href="base + '/commits'">
            <span x-icon="{ name: 'file-diff', size: 15 }"></span>
            <span x-text="t('project.commits')"></span>
            <span class="tab__count" x-show="repo" x-text="repo && repo.commits_count"></span>
          </a>
          <a class="tab" x-show="canManage && repo && repo.has_work_tree"
            :class="tab === 'changes' ? 'is-active' : ''" :href="base + '/changes'">
            <span x-icon="{ name: 'git-commit-vertical', size: 15 }"></span>
            <span x-text="t('sidebar.gitWorkflow')"></span>
            <span class="tab__count" x-show="changesCount" x-text="changesCount"></span>
          </a>
          <a class="tab" :class="tab === 'branches' ? 'is-active' : ''" :href="base + '/branches'">
            <span x-icon="{ name: 'git-branch', size: 15 }"></span>
            <span x-text="t('project.branches')"></span>
            <span class="tab__count" x-show="repo" x-text="repo && repo.branches_count"></span>
          </a>
          <a class="tab" :class="tab === 'tags' ? 'is-active' : ''" :href="base + '/tags'">
            <span x-icon="{ name: 'tag', size: 15 }"></span>
            <span x-text="t('project.tags')"></span>
            <span class="tab__count" x-show="repo" x-text="repo && repo.tags_count"></span>
          </a>
          <a class="tab" :class="tab === 'stats' ? 'is-active' : ''" :href="base + '/stats'">
            <span x-icon="{ name: 'chart-bar', size: 15 }"></span>
            <span x-text="t('sidebar.statistics')"></span>
          </a>
          <a class="tab" :class="tabIs('issues') ? 'is-active' : ''" :href="base + '/issues'">
            <span x-icon="{ name: 'triangle-alert', size: 15 }"></span>
            <span x-text="t('project.issues')"></span>
            <span class="tab__count" x-show="repo && repo.open_issues_count"
              x-text="repo && repo.open_issues_count"></span>
          </a>
          <a class="tab" :class="tabIs('prs') ? 'is-active' : ''" :href="base + '/pull_requests'">
            <span x-icon="{ name: 'git-pull-request', size: 15 }"></span>
            <span x-text="t('project.mergeRequests')"></span>
          </a>
          <a class="tab" :class="tabIs('tasks') ? 'is-active' : ''" :href="base + '/tasks'">
            <span x-icon="{ name: 'clipboard-list', size: 15 }"></span>
            <span x-text="t('project.tasks')"></span>
          </a>
          <a class="tab" :class="tab === 'releases' ? 'is-active' : ''" :href="base + '/releases'">
            <span x-icon="{ name: 'package', size: 15 }"></span>
            <span x-text="t('project.releases')"></span>
          </a>
          <a class="tab" x-show="canManage" :class="tab === 'settings' ? 'is-active' : ''"
            :href="base + '/settings'">
            <span x-icon="{ name: 'settings', size: 15 }"></span>
            <span x-text="t('project.settings')"></span>
          </a>
          <a class="tab" x-show="canManage" :class="tab === 'sync' ? 'is-active' : ''"
            :href="base + '/sync'">
            <span x-icon="{ name: 'refresh-cw', size: 15 }"></span>
            <span x-text="t('project.sync')"></span>
          </a>
        </div>

        <!-- files -->
        <section x-show="tab === 'tree'">
          <!-- directory listing -->
          <div class="card" x-show="!file">
            <div class="card__head file-head">
              <div class="crumbs">
                <a :href="base" x-text="repo && repo.name"></a>
                <template x-for="(seg, i) in crumbSegs" :key="i">
                  <span class="row gap-6">
                    <span class="muted-2">/</span>
                    <a :href="base + '/tree/' + crumbSegs.slice(0, i + 1).join('/')" x-text="seg"></a>
                  </span>
                </template>
              </div>
              <a class="commit-brief" x-show="lastCommit && lastCommit.hash"
                :href="base + '/commits'" :title="lastCommit && lastCommit.message">
                <span class="hash-chip mono" x-text="lastCommit && lastCommit.hash"></span>
                <span class="commit-brief__msg" x-text="lastCommit && lastCommit.message"></span>
                <span class="text-xs muted-2" x-text="lastCommit && relativeTime(lastCommit.time)"></span>
              </a>
              <button class="btn btn--sm" x-show="canEditFile" @click="startNewFile"
                x-text="t('fileViewer.newFile')"></button>
            </div>
            <div class="card__body" x-show="showNewFile" x-cloak>
              <div class="form-grid">
                <label class="label" x-text="t('fileViewer.filePath')"></label>
                <input class="input mono" x-model="newFile.path" placeholder="src/main.go" />
                <label class="label" x-text="t('fileViewer.commitMessage')"></label>
                <input class="input" x-model="newFile.message"
                  :placeholder="t('fileViewer.commitPlaceholder')" />
              </div>
              <textarea class="textarea mono mt-12" rows="12" x-model="newFile.content"></textarea>
              <div class="row between mt-12">
                <span class="text-xs muted-2" x-text="t('fileViewer.editHint')"></span>
                <div class="row gap-8">
                  <button class="btn btn--sm" @click="showNewFile = false" x-text="t('common.cancel')"></button>
                  <button class="btn btn--primary btn--sm" :disabled="savingFile" @click="createFile"
                    x-text="t('common.create')"></button>
                </div>
              </div>
            </div>

            <table class="table">
              <tbody>
                <tr x-show="dirPath">
                  <td colspan="2">
                    <a class="row gap-8 muted" :href="parentUrl">
                      <span x-icon="{ name: 'chevron-left', size: 14 }"></span>
                      <span x-text="'..'"></span>
                    </a>
                  </td>
                </tr>
                <template x-for="entry in entries" :key="entry.path">
                  <tr>
                    <td style="width: 15px; padding-right: 0">
                      <span x-html="icon(iconFor(entry).icon, { size: 15, color: iconFor(entry).color })"></span>
                    </td>
                    <td>
                      <a :href="base + '/tree/' + entry.path" x-text="entry.name"></a>
                    </td>
                    <td class="muted text-xs truncate" style="max-width: 320px"
                      x-text="entry.last_commit_message || ''"></td>
                    <td class="muted text-xs text-right" style="width: 140px"
                      x-text="entry.last_commit_time ? relativeTime(entry.last_commit_time) : ''"></td>
                  </tr>
                </template>
              </tbody>
            </table>
            <div class="empty" x-show="!entries.length" x-cloak>
              <div class="empty__desc" x-text="emptyMessage"></div>
            </div>
          </div>

          <!-- file view -->
          <div x-show="file" x-cloak>
            <div class="card">
              <div class="card__head">
                <span class="card__title mono" x-text="filePath"></span>
                <div class="row gap-8">
                  <span class="text-xs muted-2" x-text="fileSize"></span>
                  <button class="btn btn--sm" x-show="fileHtml && !editing"
                    @click="fileSource = !fileSource"
                    x-text="fileSource ? t('fileViewer.rendered') : t('fileViewer.viewSource')"></button>
                  <button class="btn btn--sm" x-show="canEditFile && !editing" @click="startEdit"
                    x-text="t('fileViewer.edit')"></button>
                  <button class="btn btn--sm btn--danger-ghost" x-show="canEditFile && !editing" @click="removeFile"
                    x-text="t('common.delete')"></button>
                </div>
              </div>
              <div class="code-block" style="border: 0; border-radius: 0" x-show="!editing && (!fileHtml || fileSource)">
                <pre><code class="hljs" :class="fileLangClass" x-ref="fileCode"
                  x-text="fileContent"></code></pre>
              </div>
              <div class="card__body" x-show="!editing && fileHtml && !fileSource" x-cloak>
                <div class="md" x-html="fileHtml"></div>
              </div>
              <div class="card__body" x-show="editing" x-cloak>
                <textarea class="textarea mono" rows="18" x-model="editContent"></textarea>
                <div class="form-grid mt-16">
                  <label class="label" x-text="t('fileViewer.commitMessage')"></label>
                  <input class="input" x-model="editMessage" :placeholder="t('fileViewer.commitPlaceholder')" />
                </div>
                <div class="row between mt-16">
                  <span class="text-xs muted-2" x-text="t('fileViewer.editHint')"></span>
                  <div class="row gap-8">
                    <button class="btn btn--sm" @click="cancelEdit" x-text="t('common.cancel')"></button>
                    <button class="btn btn--primary btn--sm" :disabled="savingFile" @click="saveFile"
                      x-text="t('common.save')"></button>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- readme -->
          <div class="card mt-20" x-show="!file && readmeHtml" x-cloak>
            <div class="card__head">
              <span class="card__title" x-text="readmePath || 'README.md'"></span>
              <a class="btn btn--sm btn--ghost" :href="base + '/tree/' + encodeURIComponent(readmePath) + '?source=1'"
                x-text="t('fileViewer.viewSource')"></a>
            </div>
            <div class="card__body">
              <div class="md" x-html="readmeHtml"></div>
            </div>
          </div>
        </section>

        <!-- commits -->
        <section x-show="tab === 'commits'" x-cloak>
          <div class="card">
            <div class="card__head">
              <span class="card__title" x-text="t('project.commits')"></span>
              <div class="row gap-8">
                <button class="btn btn--sm" @click="toggleGraph"
                  x-text="showGraph ? t('projectCommits.hideGraph') : t('projectCommits.showGraph')"></button>
                <button class="btn btn--sm" x-show="repo && repo.has_work_tree"
                  :class="rangeMode ? 'btn--primary' : ''" @click="toggleRangeMode"
                  x-text="t('gitWorkflow.selectForDelete')"></button>
              </div>
            </div>
            <table class="table">
              <thead>
                <tr>
                  <th class="commit-graph-cell" x-show="showGraph"></th>
                  <th x-text="t('admin.messageCol')"></th>
                  <th style="width: 160px" x-text="t('commit.author')"></th>
                  <th style="width: 90px" x-text="t('project.hash')"></th>
                  <th style="width: 140px" x-text="t('admin.timeCol')"></th>
                </tr>
              </thead>
              <tbody>
                <template x-for="(c, i) in commits" :key="c.hash">
                  <tr :class="inRange(i) ? 'row--picked' : ''"
                    :style="rangeMode ? 'cursor: pointer' : ''" @click="rangeMode && pickRange(i)">
                    <td class="commit-graph-cell" x-show="showGraph" x-html="graphSvg(i)"></td>
                    <td class="truncate" style="max-width: 460px">
                      <template x-if="!rangeMode">
                        <a :href="base + '/commits/' + c.hash" x-text="c.message"></a>
                      </template>
                      <template x-if="rangeMode">
                        <span x-text="c.message"></span>
                      </template>
                    </td>
                    <td class="muted" x-text="c.author"></td>
                    <td class="mono muted-2">
                      <template x-if="!rangeMode">
                        <a :href="base + '/commits/' + c.hash" x-text="c.short_hash"></a>
                      </template>
                      <template x-if="rangeMode">
                        <span x-text="c.short_hash"></span>
                      </template>
                    </td>
                    <td class="muted text-xs" x-text="relativeTime(c.date)"></td>
                  </tr>
                </template>
              </tbody>
            </table>
            <div class="empty" x-show="!commits.length" x-cloak>
              <div class="empty__desc" x-text="t('commit.noCommits')"></div>
            </div>
          </div>

          <div class="card mt-16" x-show="rangeMode" x-cloak>
            <div class="card__body row between gap-12 wrap" style="padding: 16px 18px">
              <span class="text-sm muted"
                x-text="rangeSelection().count
                  ? t('gitWorkflow.deleteRangeHint', { from: rangeSelection().from.slice(0, 7), to: rangeSelection().to.slice(0, 7) })
                  : t('gitWorkflow.selectForDeleteHint')"></span>
              <div class="row gap-8">
                <button class="btn btn--sm" @click="toggleRangeMode" x-text="t('common.cancel')"></button>
                <button class="btn btn--sm btn--danger" :disabled="!rangeSelection().count"
                  @click="deleteRange" x-text="t('gitWorkflow.deleteCommit')"></button>
              </div>
            </div>
          </div>

          <div class="row center gap-8 mt-16" x-show="commitPages > 1" x-cloak>
            <button class="btn btn--sm" :disabled="commitPage <= 1" @click="goCommitPage(commitPage - 1)"
              x-text="t('projects.prevPage')"></button>
            <span class="text-sm muted" x-text="commitPage + ' / ' + commitPages"></span>
            <button class="btn btn--sm" :disabled="commitPage >= commitPages" @click="goCommitPage(commitPage + 1)"
              x-text="t('projects.nextPage')"></button>
          </div>
        </section>

        <!-- branches -->
        <section x-show="tab === 'branches'" x-cloak>
          <div class="card">
            <div class="list">
              <template x-for="b in branches" :key="b">
                <div class="list__item" style="align-items: center">
                  <span x-icon="{ name: 'git-branch', size: 15, color: '#6b7280' }"></span>
                  <span class="mono grow" x-text="b"></span>
                  <span class="badge badge--green" x-show="repo && b === repo.default_branch"
                    x-text="t('project.defaultBranch')"></span>
                </div>
              </template>
              <div class="empty" x-show="!branches.length" x-cloak>
                <div class="empty__desc" x-text="t('common.noData')"></div>
              </div>
            </div>
          </div>
        </section>

        <!-- git workflow -->
        <section x-show="tab === 'changes'" x-cloak style="max-width: 1000px">
          <div class="row between mb-12 wrap gap-12">
            <h1 class="page-title" x-text="t('sidebar.gitWorkflow')"></h1>
            <div class="row gap-8 wrap">
              <span class="badge badge--gray mono" x-show="gitBranch" x-text="gitBranch"></span>
              <button class="btn btn--sm" :disabled="gitLoading" @click="loadGitStatus">
                <span x-icon="{ name: 'refresh-cw', size: 14 }"></span>
                <span x-text="t('common.refresh')"></span>
              </button>
            </div>
          </div>

          <div class="alert alert--warn mb-16" x-show="gitBusy" x-cloak>
            <span class="grow" x-text="t('gitWorkflow.conflictHint')"></span>
            <span class="mono text-xs" x-show="gitOperation" x-text="gitOperation"></span>
            <button class="btn btn--sm btn--danger-ghost" x-show="gitOperation" @click="abortGitOperation"
              x-text="t('gitWorkflow.abortOp')"></button>
          </div>

          <div class="alert alert--info mb-16" x-show="!loading && repo && !repo.has_work_tree" x-cloak
            x-text="t('gitWorkflow.notWorkTree')"></div>

          <div class="card mb-16" x-show="gitConflicts.length" x-cloak>
            <div class="card__head">
              <span class="card__title" x-text="t('gitWorkflow.conflict')"></span>
            </div>
            <div class="list">
              <template x-for="f in gitConflicts" :key="'c-' + f">
                <div class="list__item change-row">
                  <span x-icon="{ name: 'triangle-alert', size: 14, color: '#b45309' }"></span>
                  <span class="mono grow truncate" x-text="f"></span>
                </div>
              </template>
            </div>
          </div>

          <!-- staged -->
          <div class="card mb-16" x-show="gitStaged.length">
            <div class="card__head">
              <span class="card__title">
                <span x-text="t('gitWorkflow.staged')"></span>
                <span class="muted-2" x-text="' · ' + gitStaged.length"></span>
              </span>
              <button class="btn btn--sm" :disabled="staging" @click="unstageAll"
                x-text="t('gitWorkflow.unstageAll')"></button>
            </div>
            <div class="list">
              <template x-for="f in gitStaged" :key="'s-' + f.path">
                <div class="list__item change-row">
                  <span class="badge badge--green" x-text="f.status"></span>
                  <span class="mono grow truncate" x-text="f.path"></span>
                  <button class="btn btn--sm btn--ghost" @click="openDiff(f, true)"
                    x-text="t('gitWorkflow.viewDiff')"></button>
                  <button class="btn btn--sm" :disabled="staging" @click="unstageFiles([f])"
                    x-text="t('gitWorkflow.unstage')"></button>
                </div>
              </template>
            </div>
          </div>

          <!-- unstaged -->
          <div class="card mb-16" x-show="gitUnstaged.length">
            <div class="card__head">
              <span class="card__title">
                <span x-text="t('gitWorkflow.unstaged')"></span>
                <span class="muted-2" x-text="' · ' + gitUnstaged.length"></span>
              </span>
              <button class="btn btn--sm" :disabled="staging" @click="stageAll"
                x-text="t('gitWorkflow.stageAll')"></button>
            </div>
            <div class="list">
              <template x-for="f in gitUnstaged" :key="'u-' + f.path">
                <div class="list__item change-row">
                  <span class="badge badge--amber" x-text="f.status"></span>
                  <span class="mono grow truncate" x-text="f.path"></span>
                  <button class="btn btn--sm btn--ghost" @click="openDiff(f, false)"
                    x-text="t('gitWorkflow.viewDiff')"></button>
                  <button class="btn btn--sm btn--danger-ghost" @click="discardFile(f, false)"
                    x-text="t('gitWorkflow.discard')"></button>
                  <button class="btn btn--sm" :disabled="staging" @click="stageFiles([f])"
                    x-text="t('gitWorkflow.stage')"></button>
                </div>
              </template>
            </div>
          </div>

          <!-- untracked -->
          <div class="card mb-16" x-show="gitUntracked.length">
            <div class="card__head">
              <span class="card__title">
                <span x-text="t('gitWorkflow.untracked')"></span>
                <span class="muted-2" x-text="' · ' + gitUntracked.length"></span>
              </span>
            </div>
            <div class="list">
              <template x-for="f in gitUntracked" :key="'t-' + f.path">
                <div class="list__item change-row">
                  <span class="badge badge--gray" x-text="f.status"></span>
                  <span class="mono grow truncate" x-text="f.path"></span>
                  <button class="btn btn--sm btn--danger-ghost" @click="discardFile(f, true)"
                    x-text="t('gitWorkflow.discard')"></button>
                  <button class="btn btn--sm" :disabled="staging" @click="stageFiles([f])"
                    x-text="t('gitWorkflow.stage')"></button>
                </div>
              </template>
            </div>
          </div>

          <div class="card mb-16" x-show="!gitLoading && !changesCount && repo && repo.has_work_tree" x-cloak>
            <div class="empty empty--tight">
              <div class="empty__desc" x-text="t('gitWorkflow.cleanWorking')"></div>
            </div>
          </div>

          <!-- selected file diff -->
          <div class="card mb-16" x-show="diffPath" x-cloak>
            <div class="card__head">
              <span class="card__title mono truncate" x-text="diffPath"></span>
              <div class="row gap-8">
                <span class="badge" x-show="diffResult && !diffResult.is_binary"
                  x-text="'+' + ((diffResult && diffResult.additions) || 0)"></span>
                <span class="badge badge--red" x-show="diffResult && !diffResult.is_binary"
                  x-text="'-' + ((diffResult && diffResult.deletions) || 0)"></span>
                <span class="badge badge--gray"
                  x-text="diffStaged ? t('gitWorkflow.stagedDiff') : t('gitWorkflow.unstagedDiff')"></span>
              </div>
            </div>
            <div class="diff" x-show="!diffLoading && !(diffResult && diffResult.is_binary)">
              <template x-for="(line, i) in diffRows()" :key="i">
                <div :class="line.cls">
                  <template x-if="diffCanPick && line.cls.indexOf('diff__line--') >= 0">
                    <span class="diff__pick">
                      <input type="checkbox" x-model="lineSel[i]" />
                    </span>
                  </template>
                  <span class="diff__sign" x-text="line.sign"></span>
                  <span class="diff__text" x-text="line.text"></span>
                </div>
              </template>
            </div>
            <div class="card__body row between gap-12 wrap" style="padding: 14px 18px" x-show="diffCanPick" x-cloak>
              <span class="text-xs muted-2" x-text="t('gitWorkflow.selectLinesHint')"></span>
              <div class="row gap-8">
                <button class="btn btn--sm" :disabled="!pickedLines().length" @click="clearLines"
                  x-text="t('gitWorkflow.clearSelection')"></button>
                <button class="btn btn--primary btn--sm" :disabled="stagingLines || !pickedLines().length"
                  @click="stageSelectedLines"
                  x-text="t('gitWorkflow.stageSelectedLines', { count: pickedLines().length })"></button>
              </div>
            </div>
            <div class="empty empty--tight" x-show="diffLoading">
              <div class="empty__desc" x-text="t('common.loading')"></div>
            </div>
            <div class="empty empty--tight" x-show="!diffLoading && diffResult && diffResult.is_binary">
              <div class="empty__desc" x-text="t('gitWorkflow.binaryFileHint')"></div>
            </div>
            <div class="empty empty--tight" x-show="!diffLoading && diffResult && !diffResult.is_binary && !diffRows().length">
              <div class="empty__desc" x-text="t('common.noData')"></div>
            </div>
          </div>

          <!-- commit -->
          <div class="card mb-16" x-show="repo && repo.has_work_tree">
            <div class="card__head">
              <span class="card__title" x-text="t('gitWorkflow.commit')"></span>
            </div>
            <div class="card__body" style="padding: 20px">
              <textarea class="textarea" rows="3" x-model="commitMessage"
                :placeholder="t('gitWorkflow.commitPlaceholder')"></textarea>
              <div class="row between mt-12 gap-12 wrap">
                <span class="text-xs muted-2"
                  x-text="gitStaged.length ? gitStaged.length + ' · ' + t('gitWorkflow.staged') : t('gitWorkflow.noStagedFiles')"></span>
                <button class="btn btn--primary btn--sm"
                  :disabled="committing || gitBusy || !gitStaged.length || !commitMessage.trim()"
                  @click="commitStaged" x-text="t('gitWorkflow.commit')"></button>
              </div>
            </div>
          </div>

          <!-- branches -->
          <div class="card mb-16" x-show="repo && repo.has_work_tree">
            <div class="card__head">
              <span class="card__title" x-text="t('gitWorkflow.branchOps')"></span>
            </div>
            <div class="card__body" style="padding: 20px">
              <div class="row gap-8 wrap">
                <select class="select" x-model="branchDraft" style="max-width: 220px">
                  <template x-for="b in branches" :key="'sw-' + b">
                    <option :value="b" x-text="b"></option>
                  </template>
                </select>
                <button class="btn btn--sm" :disabled="gitBusy || !branchDraft || branchDraft === gitBranch"
                  @click="switchBranch" x-text="t('gitWorkflow.switchTo')"></button>
                <input class="input" x-model="newBranch" :placeholder="t('gitWorkflow.branchNamePlaceholder')"
                  style="max-width: 200px" />
                <button class="btn btn--sm" @click="createBranchFrom"
                  x-text="t('gitWorkflow.createBranch')"></button>
              </div>
              <div class="row gap-8 wrap mt-12">
                <select class="select" x-model="mergeSource" style="max-width: 220px">
                  <option value="" x-text="t('gitWorkflow.selectSourceBranch')"></option>
                  <template x-for="b in mergeCandidates()" :key="'mg-' + b">
                    <option :value="b" x-text="b"></option>
                  </template>
                </select>
                <button class="btn btn--sm" :disabled="gitBusy || !mergeSource"
                  @click="mergeInto(mergeSource)" x-text="t('gitWorkflow.mergeBranch')"></button>
              </div>
            </div>
          </div>

          <!-- interactive rebase -->
          <div class="card mb-16" x-show="repo && repo.has_work_tree">
            <div class="card__head">
              <span class="card__title" x-text="t('gitWorkflow.rebaseEditorTitle')"></span>
            </div>
            <div class="card__body" style="padding: 20px">
              <div class="row gap-8 wrap">
                <select class="select" x-model="rebaseBase" style="max-width: 320px">
                  <option value="" x-text="t('gitWorkflow.basePlaceholder')"></option>
                  <template x-for="c in recentCommits" :key="'rb-' + c.hash">
                    <option :value="c.hash" x-text="c.short_hash + '  ' + c.message"></option>
                  </template>
                </select>
                <button class="btn btn--sm" :disabled="!rebaseBase" @click="buildRebase"
                  x-text="t('gitWorkflow.rebaseLoad')"></button>
                <button class="btn btn--sm btn--primary" :disabled="rebasing || !rebaseTodos.length"
                  @click="runRebase" x-text="t('gitWorkflow.executeRebase')"></button>
              </div>
              <div class="text-xs muted-2 mt-8" x-text="t('gitWorkflow.rebaseBaseHint')"></div>

              <div class="list mt-12" x-show="rebaseTodos.length" x-cloak>
                <template x-for="(todo, i) in rebaseTodos" :key="'td-' + todo.hash">
                  <div class="list__item change-row">
                    <span class="mono muted-2 text-xs" x-text="todo.short"></span>
                    <span class="grow truncate" x-text="todo.message"></span>
                    <select class="select select--sm" x-model="todo.action">
                      <option value="pick" x-text="t('gitWorkflow.rebasePick')"></option>
                      <option value="squash" x-text="t('gitWorkflow.rebaseSquash')"></option>
                      <option value="fixup" x-text="t('gitWorkflow.rebaseFixup')"></option>
                      <option value="edit" x-text="t('gitWorkflow.rebaseEdit')"></option>
                      <option value="drop" x-text="t('gitWorkflow.rebaseDrop')"></option>
                    </select>
                    <button class="btn btn--sm btn--ghost" :disabled="i === 0" @click="moveTodo(i, -1)"
                      x-text="'↑'"></button>
                    <button class="btn btn--sm btn--ghost" :disabled="i === rebaseTodos.length - 1"
                      @click="moveTodo(i, 1)" x-text="'↓'"></button>
                  </div>
                </template>
              </div>
              <div class="empty empty--tight" x-show="!rebaseTodos.length">
                <div class="empty__desc" x-text="t('gitWorkflow.noCommitsForRebase')"></div>
              </div>
            </div>
          </div>

          <!-- stash -->
          <div class="card" x-show="repo && repo.has_work_tree">
            <div class="card__head">
              <span class="card__title" x-text="t('gitWorkflow.stashManagement')"></span>
            </div>
            <div class="card__body" style="padding: 20px">
              <div class="row gap-8 wrap">
                <input class="input grow" x-model="stashMessage"
                  :placeholder="t('gitWorkflow.stashMsgPlaceholder')" style="min-width: 200px" />
                <button class="btn btn--sm" @click="saveStash" x-text="t('gitWorkflow.stashSave')"></button>
              </div>
              <div class="list mt-12">
                <template x-for="s in stashes" :key="'st-' + s.index">
                  <div class="list__item change-row">
                    <span class="mono muted-2 text-xs" x-text="'stash@{' + s.index + '}'"></span>
                    <span class="grow truncate" x-text="s.message"></span>
                    <span class="text-xs muted-2" x-text="s.date"></span>
                    <button class="btn btn--sm btn--ghost" @click="stashAction('pop', s)"
                      x-text="t('gitWorkflow.stashPop')"></button>
                    <button class="btn btn--sm btn--ghost" @click="stashAction('apply', s)"
                      x-text="t('gitWorkflow.stashApply')"></button>
                    <button class="btn btn--sm btn--danger-ghost" @click="stashAction('drop', s)"
                      x-text="t('gitWorkflow.stashDrop')"></button>
                  </div>
                </template>
                <div class="empty empty--tight" x-show="!stashes.length">
                  <div class="empty__desc" x-text="t('gitWorkflow.noStash')"></div>
                </div>
              </div>
            </div>
          </div>
        </section>

        <!-- commit detail -->
        <section x-show="tab === 'commit'" x-cloak>
          <a class="text-sm muted" :href="base + '/commits'">
            <span x-text="'← ' + t('project.commits')"></span>
          </a>

          <div class="empty" x-show="commitError" x-cloak>
            <div class="empty__icon" x-icon="{ name: 'git-commit-vertical', size: 36 }"></div>
            <div class="empty__title" x-text="commitError"></div>
          </div>

          <div x-show="!commitError && commit">
            <div class="card mt-16">
              <div class="card__body" style="padding: 24px">
                <div class="detail-title" x-text="commit && commit.message"></div>
                <div class="detail-meta mt-8">
                  <span class="hash-chip mono" x-text="commit && commit.short_hash"></span>
                  <span x-text="commit && commit.author"></span>
                  <span class="muted-2" x-text="commit && commit.author_email"></span>
                  <span x-text="commit && relativeTime(commit.date)"></span>
                </div>
                <div class="row gap-8 mt-16 wrap">
                  <span class="badge badge--green"
                    x-text="'+' + ((commit && commit.stats && commit.stats.total_additions) || 0)"></span>
                  <span class="badge badge--red"
                    x-text="'-' + ((commit && commit.stats && commit.stats.total_deletions) || 0)"></span>
                  <span class="text-sm muted"
                    x-text="((commit && commit.stats && commit.stats.files_changed) || 0) + ' ' + t('commit.changedFiles')"></span>
                </div>
                <div class="mt-12 text-xs muted-2" x-show="commit && commit.parents && commit.parents.length">
                  <span x-text="t('commitDetail.parentCommit') + ' '"></span>
                  <template x-for="p in (commit && commit.parents) || []" :key="p">
                    <a class="mono mr-8" :href="base + '/commits/' + p" x-text="p.slice(0, 7)"></a>
                  </template>
                </div>
              </div>
            </div>

            <!-- commit actions -->
            <div class="card mt-20" x-show="repo && repo.has_work_tree" x-cloak>
              <div class="card__head">
                <span class="card__title" x-text="t('gitWorkflow.commitActions')"></span>
                <span class="text-xs muted-2" x-text="t('gitWorkflow.cherryPickHint')"></span>
              </div>
              <div class="card__body row gap-8 wrap" style="padding: 16px 18px">
                <button class="btn btn--sm" @click="cherryPickCommit" x-text="t('gitWorkflow.cherryPick')"></button>
                <button class="btn btn--sm" @click="revertCommit" x-text="t('gitWorkflow.revert')"></button>
                <button class="btn btn--sm btn--danger-ghost" @click="resetToCommit"
                  x-text="t('gitWorkflow.reset')"></button>
              </div>
            </div>
            <div class="alert alert--info mt-16" x-show="repo && !repo.has_work_tree" x-cloak
              x-text="t('gitWorkflow.actionNeedsWorkTree')"></div>

            <div class="card mt-20" x-show="commit && commit.files && commit.files.length">
              <div class="card__head">
                <span class="card__title" x-text="t('commit.changedFiles')"></span>
              </div>
              <template x-for="f in (commit && commit.files) || []" :key="f.filename">
                <details class="commit-file">
                  <summary class="commit-file__head">
                    <span class="mono grow truncate" x-text="f.filename"></span>
                    <span class="badge badge--green" x-text="'+' + (f.additions || 0)"></span>
                    <span class="badge badge--red" x-text="'-' + (f.deletions || 0)"></span>
                  </summary>
                  <div class="diff" x-show="patchLines(f.patch).length">
                    <template x-for="(line, i) in patchLines(f.patch)" :key="i">
                      <div :class="line.cls">
                        <span class="diff__sign" x-text="line.sign"></span>
                        <span class="diff__text" x-text="line.text"></span>
                      </div>
                    </template>
                  </div>
                  <div class="empty empty--tight" x-show="!patchLines(f.patch).length">
                    <div class="empty__desc" x-text="t('common.noData')"></div>
                  </div>
                </details>
              </template>
            </div>
          </div>
        </section>

        <!-- tags -->
        <section x-show="tab === 'tags'" x-cloak>
          <div class="row between mb-12">
            <h1 class="page-title" x-text="t('project.tags')"></h1>
            <button class="btn btn--sm btn--primary" x-show="canManage" @click="showTagForm = !showTagForm"
              x-text="t('projectCommits.createTag')"></button>
          </div>

          <div class="card mb-16" x-show="canManage && showTagForm" x-cloak>
            <div class="card__body" style="padding: 20px">
              <div class="row gap-12 wrap" style="align-items: flex-end">
                <div class="field grow" style="margin: 0">
                  <label class="label" x-text="t('projectCommits.tagName')"></label>
                  <input class="input" x-model="tagDraft.name" placeholder="v1.0.0" />
                </div>
                <div class="field grow" style="margin: 0">
                  <label class="label" x-text="t('projectCommits.tagBranch')"></label>
                  <select class="select" x-model="tagDraft.branch">
                    <template x-for="b in branches" :key="b">
                      <option :value="b" x-text="b"></option>
                    </template>
                  </select>
                </div>
                <button class="btn btn--primary btn--sm" :disabled="savingTag || !tagDraft.name.trim()"
                  @click="createTag" x-text="t('common.create')"></button>
              </div>
            </div>
          </div>

          <div class="card">
            <div class="list">
              <template x-for="tag in tags" :key="tag">
                <div class="list__item" style="align-items: center">
                  <span x-icon="{ name: 'tag', size: 15, color: '#6b7280' }"></span>
                  <span class="mono grow" x-text="tag"></span>
                  <button class="btn btn--sm btn--danger-ghost" x-show="canManage" @click="deleteTag(tag)"
                    x-text="t('common.delete')"></button>
                </div>
              </template>
              <div class="empty" x-show="!tags.length" x-cloak>
                <div class="empty__desc" x-text="t('projectTags.noTags')"></div>
              </div>
            </div>
          </div>
        </section>

        <!-- releases -->
        <section x-show="tab === 'releases'" x-cloak>
          <div class="row between mb-12">
            <h1 class="page-title" x-text="t('project.releases')"></h1>
            <button class="btn btn--sm" x-show="canManage && repo && repo.project_type !== 'local'"
              :disabled="syncingReleases" @click="syncReleases"
              x-text="syncingReleases ? t('release.syncing') : t('projectReleases.syncFromRemote')"></button>
          </div>

          <div class="empty" x-show="releaseError" x-cloak>
            <div class="empty__desc" x-text="releaseError"></div>
          </div>

          <div class="card mb-16" x-show="!releaseError" x-cloak>
            <template x-for="r in releases" :key="r.id || r.tag_name">
              <div class="release">
                <div class="row between gap-12 wrap">
                  <div class="row gap-8 wrap">
                    <span class="badge badge--blue mono" x-text="r.tag_name"></span>
                    <span class="strong" x-text="r.title || r.tag_name"></span>
                    <span class="badge badge--amber" x-show="r.is_prerelease"
                      x-text="t('projectReleases.prerelease')"></span>
                    <span class="badge badge--gray" x-show="r.is_draft"
                      x-text="t('projectReleases.draft')"></span>
                  </div>
                  <span class="text-xs muted-2"
                    x-text="((r.author && r.author.username) || '') + ' · ' + fmt.formatDate(r.created_at)"></span>
                </div>
                <div class="md mt-12" x-show="r.body" x-html="markdownHtml(r.body)"></div>
              </div>
            </template>
            <div class="empty" x-show="!releases.length" x-cloak>
              <div class="empty__desc" x-text="t('projectReleases.noReleases')"></div>
            </div>
          </div>
        </section>

        <!-- statistics -->
        <section x-show="tab === 'stats'" x-cloak>
          <h1 class="page-title mb-20" x-text="t('stats.title')"></h1>

          <div class="empty" x-show="statsError" x-cloak>
            <div class="empty__desc" x-text="statsError"></div>
          </div>

          <div class="grid grid--4 mb-20" x-show="codeStats">
            <div class="stat-mini">
              <span class="stat-mini__label" x-text="t('stats.totalLines')"></span>
              <span class="stat-mini__value" x-text="(codeStats && codeStats.total_lines) || 0"></span>
            </div>
            <div class="stat-mini">
              <span class="stat-mini__label" x-text="t('stats.codeLines')"></span>
              <span class="stat-mini__value" x-text="(codeStats && codeStats.code_lines) || 0"></span>
            </div>
            <div class="stat-mini">
              <span class="stat-mini__label" x-text="t('stats.commentLines')"></span>
              <span class="stat-mini__value" x-text="(codeStats && codeStats.comment_lines) || 0"></span>
            </div>
            <div class="stat-mini">
              <span class="stat-mini__label" x-text="t('stats.blankLines')"></span>
              <span class="stat-mini__value" x-text="(codeStats && codeStats.blank_lines) || 0"></span>
            </div>
          </div>

          <div class="card mb-20" x-show="languageRows.length">
            <div class="card__head">
              <span class="card__title" x-text="t('stats.languageDistribution')"></span>
            </div>
            <div class="card__body" style="padding: 20px">
              <template x-for="lang in languageRows" :key="lang.name">
                <div class="lang-row">
                  <span class="mono text-sm" style="width: 120px" x-text="lang.name"></span>
                  <span class="lang-bar"><span class="lang-bar__fill" :style="'width:' + lang.percent + '%'"></span></span>
                  <span class="text-xs muted-2" style="width: 110px; text-align: right"
                    x-text="lang.percent + '% · ' + lang.lines"></span>
                </div>
              </template>
            </div>
          </div>

          <div class="card mb-20" x-show="contributors.length">
            <div class="card__head">
              <span class="card__title" x-text="t('stats.contributors')"></span>
            </div>
            <table class="table">
              <tbody>
                <template x-for="c in contributors" :key="c.id || c.name">
                  <tr>
                    <td style="width: 48px">
                      <span class="avatar" x-html="avatarHtml(c.avatar, c.name)"></span>
                    </td>
                    <td>
                      <div class="strong" x-text="c.name"></div>
                      <div class="text-xs muted-2" x-text="c.email"></div>
                    </td>
                    <td class="muted text-right" style="width: 120px"
                      x-text="(c.commits_count || 0) + ' ' + t('stats.commits')"></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>

          <div class="card" x-show="commitActivity.length">
            <div class="card__head">
              <span class="card__title" x-text="t('stats.commitActivity')"></span>
            </div>
            <table class="table">
              <thead>
                <tr>
                  <th x-text="t('commit.date')"></th>
                  <th style="width: 100px" x-text="t('stats.commits')"></th>
                  <th style="width: 100px" x-text="t('commitDetail.added')"></th>
                  <th style="width: 100px" x-text="t('commitDetail.deleted')"></th>
                </tr>
              </thead>
              <tbody>
                <template x-for="day in commitActivity" :key="day.date">
                  <tr>
                    <td class="mono text-sm" x-text="day.date"></td>
                    <td x-text="day.count"></td>
                    <td class="text-green" x-text="'+' + (day.additions || 0)"></td>
                    <td class="text-red" x-text="'-' + (day.deletions || 0)"></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </section>

        <!-- issues -->
        <section x-show="tab === 'issues'" x-cloak>
          <div class="row between mb-12" x-show="canCreate">
            <span class="muted text-sm" x-text="issues.length + ' / ' + ((repo && repo.open_issues_count) || 0)"></span>
            <a class="btn btn--sm btn--primary" :href="base + '/issues/new'"
              x-text="t('issue.newIssue')"></a>
          </div>
          <div class="card">
            <div class="list">
              <template x-for="issue in issues" :key="issue.id || issue.number">
                <a class="list__item" :href="base + '/issues/' + issue.number">
                  <span x-icon="{ name: issue.is_closed ? 'circle-check-big' : 'circle-dot', size: 16,
                    color: issue.is_closed ? '#6b7280' : '#22c55e' }"></span>
                  <div class="grow">
                    <div class="strong" x-text="issue.title"></div>
                    <div class="text-xs muted-2"
                      x-text="'#' + issue.number + ' · ' + (issue.author_name || issue.user || '') + ' · ' + timeAgo(issue.created_at)"></div>
                  </div>
                  <span class="badge" :class="issue.is_closed ? 'badge--red' : 'badge--green'"
                    x-text="issue.is_closed ? t('common.closed') : t('common.open')"></span>
                </a>
              </template>
              <div class="empty" x-show="!issues.length" x-cloak>
                <div class="empty__desc" x-text="issueError || t('issue.noIssues')"></div>
              </div>
            </div>
          </div>
        </section>

        <!-- pull requests -->
        <section x-show="tab === 'prs'" x-cloak>
          <div class="row between mb-12" x-show="canCreate">
            <span class="muted text-sm" x-text="prs.length + ''"></span>
            <a class="btn btn--sm btn--primary" :href="base + '/pull_requests/new'"
              x-text="t('pr.newPR')"></a>
          </div>
          <div class="card">
            <div class="list">
              <template x-for="pr in prs" :key="pr.id || pr.number">
                <a class="list__item" :href="base + '/pull_requests/' + pr.number">
                  <span x-icon="{ name: 'git-pull-request', size: 16, color: '#8b5cf6' }"></span>
                  <div class="grow">
                    <div class="strong" x-text="pr.title"></div>
                    <div class="text-xs muted-2"
                      x-text="'#' + pr.number + ' · ' + (pr.user || pr.author_name || '') + ' · ' + timeAgo(pr.created_at)"></div>
                  </div>
                  <span class="badge"
                    :class="pr.status === 'merged' ? 'badge--purple' : (pr.status === 'closed' ? 'badge--red' : 'badge--green')"
                    x-text="pr.status"></span>
                </a>
              </template>
              <div class="empty" x-show="!prs.length" x-cloak>
                <div class="empty__desc" x-text="prError || t('pr.noPRs')"></div>
              </div>
            </div>
          </div>
        </section>

        <!-- issue detail -->
        <section x-show="tab === 'issue'" x-cloak>
          <a class="text-sm muted" :href="base + '/issues'">
            <span x-text="'← ' + t('project.issues')"></span>
          </a>

          <div class="card mt-16" x-show="issue">
            <div class="card__body" style="padding: 24px">
              <div class="detail-head">
                <div>
                  <div class="detail-title">
                    <span x-text="issue && issue.title"></span>
                    <span class="detail-title__num" x-text="issue ? '#' + issue.number : ''"></span>
                  </div>
                  <div class="detail-meta">
                    <span class="badge" :class="issue && issue.is_closed ? 'badge--red' : 'badge--green'"
                      x-text="issue && issue.is_closed ? t('issue.closed') : t('issue.open')"></span>
                    <span x-text="issue && (issue.author || issue.user || t('common.unknownUser'))"></span>
                    <span x-show="issue"
                      x-text="dated(t('common.createdAt'), issue && issue.created_at)"></span>
                  </div>
                </div>
                <div class="btn-group" x-show="canManage">
                  <button class="btn btn--sm" @click="toggleIssue"
                    x-text="issue && issue.is_closed ? t('issue.reopenIssue') : t('issue.closeIssue')"></button>
                </div>
              </div>
              <div class="md mt-16" x-show="issueHtml" x-html="issueHtml"></div>
              <div class="empty empty--tight" x-show="issue && !issueHtml">
                <div class="empty__desc" x-text="t('project.noDescription')"></div>
              </div>
            </div>
          </div>

          <div class="empty" x-show="!issue && issueError" x-cloak>
            <div class="empty__icon" x-icon="{ name: 'triangle-alert', size: 36 }"></div>
            <div class="empty__title" x-text="issueError"></div>
          </div>

          <div x-show="issue && !issueError">
            <h2 class="section-title">
              <span x-text="t('issue.comments')"></span>
              <span class="muted-2" x-text="'(' + comments.length + ')'"></span>
            </h2>

            <template x-for="c in comments" :key="c.id">
              <div class="comment">
                <span class="avatar" x-html="avatarHtml(c.avatar, c.author || c.user)"></span>
                <div class="comment__body">
                  <div class="comment__head">
                    <span class="strong" x-text="c.author || c.user || t('common.unknownUser')"></span>
                    <span x-text="timeAgo(c.created_at)"></span>

                <span class="text-xs muted-2" x-text="t('projectSettings.saveChangesHint')"></span>
                <button class="btn btn--primary btn--sm" :disabled="saving" @click="saveSettings"
                  x-text="t('projectSettings.saveChanges')"></button>
              </div>
            </div>
          </div>

          <div class="card">
            <div class="card__head">
              <span class="card__title" x-text="t('projectSettings.projectType')"></span>
              <span class="badge" :class="projectTypeClass(repo && repo.project_type)"
                x-text="projectTypeLabel(repo && repo.project_type)"></span>
            </div>
            <div class="card__body" style="padding: 24px">
              <p class="text-sm muted mb-16" x-text="typeDescription()"></p>
              <div class="row gap-12 wrap" x-show="canManage">
                <template x-for="opt in typeOptions()" :key="opt.key">
                  <button class="type-card" :class="repo && repo.project_type === opt.key ? 'is-selected' : ''"
                    :disabled="opt.disabled" @click="convertType(opt.key)">
                    <span x-icon="{ name: opt.icon, size: 20, color: opt.color }"></span>
                    <span class="type-card__label" x-text="t('project.' + opt.key)"></span>
                  </button>
                </template>
              </div>
              <div class="alert alert--info mt-16" x-show="repo && repo.project_type === 'local'"
                x-text="t('projectSettings.localCannotConvert')"></div>
            </div>
          </div>

          <div class="card">
            <div class="card__head">
              <span class="card__title" x-text="t('storage.title')"></span>
              <span class="badge" :class="repo && repo.storage_kind === 'work' ? 'badge--green' : 'badge--blue'"
                x-text="repo && repo.storage_kind === 'work' ? t('storage.work') : t('storage.bare')"></span>
            </div>
            <div class="card__body" style="padding: 24px">
              <p class="text-sm muted mb-16"
                x-text="repo && repo.storage_kind === 'work' ? t('storage.workDesc') : t('storage.bareDesc')"></p>
              <div x-show="repo && repo.local_path" x-cloak>
                <label class="label" x-text="t('storage.path')"></label>
                <div class="mono text-sm ellipsis-one-line" :title="repo && repo.local_path"
                  x-text="repo && repo.local_path"></div>
              </div>
            </div>
          </div>

          <div class="card">
            <div class="card__head">
              <span class="card__title" x-text="t('project.dangerZone')"></span>
            </div>
            <div class="card__body" style="padding: 24px">
              <div class="row between gap-16 wrap" x-show="canManage && repo && repo.project_type !== 'local'">
                <div>
                  <div class="strong" x-text="t('projectSettings.transferOwnership')"></div>
                  <div class="text-sm muted mt-4" x-text="t('projectSettings.transferDesc')"></div>
                </div>
                <div class="row gap-8">
                  <input class="input" style="width: 200px" x-model="transferTarget"
                    :placeholder="t('projectSettings.newOwnerPlaceholder')" />
                  <button class="btn btn--sm" :disabled="transferring || !transferTarget.trim()"
                    @click="transferRepo" x-text="t('projectSettings.transferProject')"></button>
                </div>
              </div>

              <div class="row between gap-16 wrap mt-20" x-show="canManage">
                <div>
                  <div class="strong" x-text="t('projectSettings.deleteProject')"></div>
                  <div class="text-sm muted mt-4" x-text="t('projectSettings.deleteWarning')"></div>
                </div>
                <div class="row gap-8">
                  <input class="input" style="width: 200px" x-model="deleteConfirm"
                    :placeholder="repoName" />
                  <button class="btn btn--danger btn--sm"
                    :disabled="deleting || deleteConfirm !== repoName" @click="deleteRepo"
                    x-text="t('projectSettings.confirmDelete')"></button>
                </div>
              </div>
              <div class="hint mt-8" x-show="canManage"
                x-text="t('projectSettings.typeRepoName', { repo: repoName })"></div>
            </div>
          </div>
        </section>

        <!-- project sync -->
        <section x-show="tab === 'sync' && canManage" x-cloak style="max-width: 900px">
          <h1 class="page-title mb-20" x-text="t('project.sync')"></h1>

          <div class="card">
            <div class="card__head">
              <span class="card__title" x-text="t('projectSettings.codeSync')"></span>
            </div>
            <div class="card__body" style="padding: 24px">
              <p class="text-sm muted mb-16" x-text="syncDesc()"></p>
              <div class="row gap-16 text-sm mb-16" x-show="repo && repo.mirror_url">
                <span class="muted-2" x-text="t('projectSettings.remoteSource') + ':'"></span>
                <a class="blue truncate" :href="repo && repo.mirror_url ? repo.mirror_url.replace(/\.git$/, '') : ''"
                  target="_blank" rel="noopener noreferrer"
                  x-text="repo && repo.mirror_url ? repo.mirror_url.replace(/\.git$/, '') : ''"></a>
              </div>
              <div class="row gap-16 text-sm mb-16" x-show="!isLocalProject()">
                <a :href="base + '/issues'">
                  <span class="muted-2" x-text="t('sidebar.issues') + ': '"></span>
                  <span x-text="((repo && repo.open_issues_count) || 0) + ((repo && repo.closed_issues_count) || 0)"></span>
                </a>
                <a :href="base + '/pull_requests'">
                  <span class="muted-2" x-text="t('sidebar.mergeRequests') + ': '"></span>
                  <span x-text="((repo && repo.open_prs_count) || 0) + ((repo && repo.closed_prs_count) || 0)"></span>
                </a>
              </div>

              <div class="row gap-10 wrap" x-show="canManage">
                <button class="btn btn--sm btn--primary" x-show="isRemoteProject()" :disabled="syncing"
                  @click="syncAll" x-text="syncing ? t('projectSettings.syncRunning') : t('projectSettings.syncAll')"></button>
                <button class="btn btn--sm" x-show="isRemoteProject()" :disabled="syncing" @click="pullCode"
                  x-text="t('projectSettings.pullCode')"></button>
                <button class="btn btn--sm" x-show="isRemoteProject()" :disabled="syncing" @click="pullIssues"
                  x-text="t('projectSettings.pullIssues')"></button>
                <button class="btn btn--sm" :disabled="syncing" @click="refreshStats"
                  x-text="t('projectSettings.refreshStats')"></button>
              </div>
              <div class="text-xs muted-2 mt-12" x-show="syncing" x-text="t('projectSettings.syncStarted')"></div>

              <div class="mt-24" x-show="canManage && !isLocalProject() && canPushProject()" x-cloak>
                <label class="label" x-text="t('projectSettings.remoteUrlLabel')"></label>
                <div class="row gap-8 wrap">
                  <input class="input grow" x-model="pushUrl"
                    :placeholder="t('projectSettings.remoteUrlPlaceholder')" />
                  <button class="btn btn--sm" :disabled="syncing" @click="pushToRemote"
                    x-text="t('projectSettings.pushToRemote')"></button>
                </div>
              </div>

              <div class="mt-24" x-show="canManage && isLocalProject()" x-cloak>
                <div class="row between mb-8">
                  <label class="label" x-text="t('projectSettings.remoteRepositories')"></label>
                  <span class="spinner spinner--sm" x-show="loadingRemotes" x-cloak></span>
                </div>
                <div class="list" x-show="remotes.length">
                  <template x-for="remote in remotes" :key="remote.name">
                    <div class="list__item">
                      <div class="grow">
                        <div class="text-sm strong" x-text="remote.name"></div>
                        <div class="text-xs muted-2 ellipsis-one-line" :title="remote.fetch_url"
                          x-text="(remote.fetch_url || '') + (remote.push_urls && remote.push_urls.length && remote.push_urls[0] !== remote.fetch_url ? ' → ' + remote.push_urls.join(', ') : '')"></div>
                      </div>
                      <button class="btn btn--sm btn--ghost" :disabled="pushingRemote === remote.name"
                        @click="pushNamedRemote(remote.name)" x-text="t('projectSettings.pushToRemote')"></button>
                      <button class="btn btn--sm btn--ghost" :title="t('projectSettings.removeRemote')"
                        @click="removeRemote(remote.name)">
                        <span x-icon="{ name: 'trash-2', size: 13 }"></span>
                      </button>
                    </div>
                  </template>
                </div>
                <div class="text-sm muted-2 mb-12" x-show="!loadingRemotes && !remotes.length"
                  x-text="t('projectSettings.noRemotes')"></div>

                <div class="row gap-8 wrap mt-8">
                  <input class="input" style="max-width: 140px" x-model="newRemoteName"
                    :placeholder="t('projectSettings.remoteName')" />
                  <input class="input grow" x-model="newRemoteUrl"
                    :placeholder="t('projectSettings.remoteUrlPlaceholder')" />
                  <button class="btn btn--sm btn--primary"
                    :disabled="addingRemote || !newRemoteName.trim() || !newRemoteUrl.trim()"
                    @click="addRemote" x-text="t('projectSettings.addRemote')"></button>
                </div>
              </div>
            </div>
          </div>

          <div class="card">
            <div class="card__head">
              <span class="card__title" x-text="t('projectSettings.scheduledSync')"></span>
              <span class="badge" :class="syncConfig && syncConfig.is_paused ? 'badge--gray' : 'badge--green'"
                x-text="syncConfig && syncConfig.is_paused ? t('projectSettings.currentlyPaused') : t('projectSettings.currentlyRunning')"></span>
            </div>
            <div class="card__body" style="padding: 24px">
              <div class="grid grid--3 mb-16">
                <div class="stat-mini">
                  <span class="stat-mini__label" x-text="t('projectSettings.lastSync')"></span>
                  <span class="stat-mini__value" x-text="syncConfig && syncConfig.last_sync_at ? fmt.formatDateTime(syncConfig.last_sync_at) : t('projectSettings.never')"></span>
                </div>
                <div class="stat-mini">
                  <span class="stat-mini__label" x-text="t('projectSettings.nextSync')"></span>
                  <span class="stat-mini__value" x-text="syncConfig && syncConfig.next_sync_at ? fmt.formatDateTime(syncConfig.next_sync_at) : t('common.manual')"></span>
                </div>
                <div class="stat-mini">
                  <span class="stat-mini__label" x-text="t('projectSettings.syncInterval')"></span>
                  <span class="stat-mini__value" x-text="syncDraft.intervalHours + 'h ' + syncDraft.intervalMinutes + 'm'"></span>
                </div>
              </div>

              <div class="alert alert--error mb-16" x-show="syncConfig && syncConfig.last_error">
                <span x-text="t('projectSettings.recentError') + ': '"></span>
                <span class="ellipsis-one-line" :title="syncConfig && syncConfig.last_error"
                  x-text="syncConfig && syncConfig.last_error"></span>
              </div>

              <div class="row gap-12 wrap" x-show="canManage">
                <div class="field" style="max-width: 140px">
                  <label class="label" x-text="t('common.hour')"></label>
                  <input class="input" type="number" min="0" max="999" x-model.number="syncDraft.intervalHours" />
                </div>
                <div class="field" style="max-width: 140px">
                  <label class="label" x-text="t('common.minute')"></label>
                  <input class="input" type="number" min="0" max="59" x-model.number="syncDraft.intervalMinutes" />
                </div>
                <label class="checkbox" style="align-self: flex-end; padding-bottom: 10px">
                  <input type="checkbox" x-model="syncDraft.is_paused" />
                  <span x-text="t('projectSettings.pauseSync')"></span>
                </label>
                <button class="btn btn--sm btn--primary" style="align-self: flex-end; margin-bottom: 10px"
                  :disabled="savingSync" @click="saveSyncConfig"
                  x-text="t('projectSettings.saveSyncConfig')"></button>
              </div>
              <div class="hint mt-8" x-text="t('projectSettings.syncIntervalHint')"></div>
            </div>
          </div>

          <div class="card">
            <div class="card__head">
              <span class="card__title" x-text="t('projectSettings.syncLogs')"></span>
              <button class="btn btn--sm btn--ghost" @click="loadSyncLogs"
                x-text="t('common.refresh')"></button>
            </div>
            <table class="table">
              <thead>
                <tr>
                  <th x-text="t('admin.timeCol')"></th>
                  <th x-text="t('projectSettings.backupStatus')"></th>
                  <th x-text="t('sync.itemsSynced')"></th>
                  <th style="width: 100px" x-text="t('sync.duration')"></th>
                </tr>
              </thead>
              <tbody>
                <template x-for="log in syncLogs" :key="log.id">
                  <tr>
                    <td class="muted text-xs" x-text="fmt.formatDateTime(log.created_at)"></td>
                    <td>
                      <span class="badge"
                        :class="log.status === 'failure' ? 'badge--red' : (log.status === 'running' ? 'badge--blue' : (log.message ? 'badge--amber' : 'badge--green'))"
                        x-text="log.status === 'failure' ? t('projectSettings.failed')
                          : (log.status === 'running' ? t('projectSettings.syncRunning')
                            : (log.message ? t('projectSettings.syncPartial') : t('projectSettings.success')))"></span>
                      <div class="muted text-xs ellipsis-one-line" :title="log.message" x-show="log.message"
                        x-text="log.message"></div>
                    </td>
                    <td class="muted" x-text="(log.items_synced || 0) + ' / ' + (log.items_failed || 0)"></td>
                    <td class="muted text-xs" x-text="log.duration ? (log.duration + ' ms') : ''"></td>
                  </tr>
                </template>
              </tbody>
            </table>
            <div class="empty empty--tight" x-show="!syncLogs.length">
              <div class="empty__desc" x-text="t('projectSettings.syncEmptyHint')"></div>
            </div>
          </div>
        </section>
      </div>
    </main>
    </div>

    <div id="app-footer"></div>
    <script src="/assets/lib/highlight.min.js" defer></script>
    <script type="module" src="/assets/js/app.js"></script>
  </body>
</html>
